{{ $filepath := printf "img/%s.jpg" (.Get "filename") }} {{ $alt := .Get "alt"}}
{{ with .Page.Resources.GetMatch $filepath }} {{ with .Process "webp q100" }}
<picture>
    <source srcset="{{ .RelPermalink }}" type="image/webp" />
    <img src="{{ $filepath }}" alt="{{ $alt }}" loading="lazy" />
</picture>
{{ end }} {{ end }}
